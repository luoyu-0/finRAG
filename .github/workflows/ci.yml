name: CI

on:
  push:
    branches: [main]
  pull_request:

# 前端位于仓库子目录，所有 run 步骤默认在该目录执行。
defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: 前端规范、类型检查、测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 代码规范检查
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试与覆盖率
        run: npm run test:coverage

      - name: 生产构建
        run: npm run build

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  backend:
    name: 后端测试与覆盖率
    runs-on: ubuntu-latest
    # 覆盖工作流级默认目录；后端步骤在 backend/ 下执行。
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install --requirement requirements-dev.txt

      - name: 单元测试与覆盖率
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  e2e:
    name: 容器集成与端到端冒烟测试
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      MYSQL_ROOT_PASSWORD: ci_root_password
      MYSQL_PASSWORD: ci_app_password
      JWT_SECRET_KEY: ci_only_secret_key_with_more_than_32_characters
      ADMIN_BOOTSTRAP_USERNAME: admin
      ADMIN_BOOTSTRAP_PASSWORD: ci_only_admin_password
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: ci_only_admin_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 校验 Compose 配置
        working-directory: .
        run: docker compose config --quiet

      - name: 构建并启动最小容器链路
        working-directory: .
        run: docker compose up -d --build --wait --wait-timeout 180 mysql backend frontend

      - name: 验证容器内导入命令
        working-directory: .
        run: docker compose run --rm --no-deps backend python process_docs.py --help

      - name: 端到端冒烟测试
        run: npm run test:e2e

      - name: 输出失败容器日志
        if: failure()
        working-directory: .
        run: docker compose logs --no-color mysql backend frontend

      - name: 清理测试容器与数据卷
        if: always()
        working-directory: .
        run: docker compose down -v

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

# 覆盖率当前只统计不设 fail 门槛（前后端一致），待业务模块与测试就位后逐步抬升。
